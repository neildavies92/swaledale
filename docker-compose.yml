services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: swaledale
      POSTGRES_USER: swaledale
      POSTGRES_PASSWORD: swaledale
    ports:
      - "5432:5432"
    volumes:
      - swaledale-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swaledale -d swaledale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swaledale-postgres:

